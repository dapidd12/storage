<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memories - Untukmu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cover-color: #58111A; /* Merah maroon untuk buku */
            --paper-color: #fdfbf7; /* Warna kertas */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            /* Latar belakang malam hari */
            background: linear-gradient(135deg, #090a0f 0%, #151924 50%, #1f2739 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- ANIMASI BINTANG (CSS) --- */
        #stars-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.5); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }

        .font-cursive { font-family: 'Dancing Script', cursive; }

        /* --- 3D SCENE & BUKU SETUP --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 2000px;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        /* Pembungkus agar posisi Buku dan Tombol tetap menyatu */
        #book-scaler {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 300px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Tempat merender buku */
        .book-wrapper {
            position: relative;
            width: 300px;
            height: 420px;
            transform-style: preserve-3d;
        }

        .book {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* Geser buku saat terbuka */
        .book.is-open { transform: translateX(50%); }

        /* --- LEAVES & PAGES (Lembar Kertas) --- */
        .leaf {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .leaf.flipped { transform: rotateY(-180deg); }

        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
        }

        .page.back { transform: rotateY(180deg); }

        .page-content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--paper-color);
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .page.front .page-content { border-radius: 2px 10px 10px 2px; }
        .page.back .page-content { border-radius: 10px 2px 2px 10px; }

        .shadow-right { box-shadow: inset 15px 0 25px -10px rgba(0,0,0,0.15); }
        .shadow-left { box-shadow: inset -15px 0 25px -10px rgba(0,0,0,0.15); }

        /* --- ANIMASI COVER & LOVE AIR HUJAN --- */
        #cover-front-content {
            background-color: transparent;
            box-shadow: none;
            transition: background-color 1.5s ease, box-shadow 1.5s ease;
        }

        /* Saat buku mulai nampak nyata (setelah love mengecil) */
        #cover-front-content.show-cover {
            background-color: var(--cover-color);
            box-shadow: inset 4px 0 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cover-element {
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        #cover-front-content.show-cover .cover-element { opacity: 1; }

        .book-closed .leaf:not(#leaf-0) { opacity: 0; pointer-events: none; }
        .book-closed .page.back { opacity: 0; pointer-events: none; }

        /* SVG Heart Size Animasi */
        #heart-svg-container {
            /* Dimulai dengan ukuran sangat besar (scale 3.5) */
            transform: scale(3.5);
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 0 15px rgba(255,77,77,0.2));
        }

        /* Kelas untuk mengecilkan love */
        #heart-svg-container.shrink {
            transform: scale(1);
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        /* Hujan Jatuh */
        .raindrops {
            animation: hideRains 0.5s 7.5s forwards; /* Sembunyikan hujan setelah 7.5 detik */
        }
        .drop {
            animation: rainFall linear infinite;
        }
        .d1 { animation-duration: 0.8s; animation-delay: 0s; }
        .d2 { animation-duration: 1.2s; animation-delay: 0.3s; }
        .d3 { animation-duration: 1s; animation-delay: 0.5s; }
        .d4 { animation-duration: 0.9s; animation-delay: 0.1s; }
        .d5 { animation-duration: 1.1s; animation-delay: 0.4s; }

        @keyframes rainFall {
            0% { transform: translateY(-20px); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(110px); opacity: 0; }
        }
        @keyframes hideRains {
            to { opacity: 0; display: none; }
        }

        /* Air Mengisi Hati */
        .water-group {
            transform: translateY(100%);
            /* Animasi mengisi lambat (7.5 detik) */
            animation: fillUp 7.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .water-wave-1 { fill: #ff1a1a; }
        .water-wave-2 { fill: #ff4d4d; animation-delay: 0.3s; }

        @keyframes fillUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0%); }
        }

        /* Polaroid styling */
        .polaroid {
            background: white;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-radius: 2px;
            transform: rotate(-2deg);
        }
        .polaroid.right-tilt { transform: rotate(2deg); }

        /* --- TOMBOL --- */
        /* Bungkus tombol persis di bawah buku (tidak di-fix di bottom layar) */
        #controls-wrapper {
            position: absolute;
            bottom: -70px;
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* Ikut geser saat buku terbuka */
        #controls-wrapper.is-open {
            transform: translateX(50%);
        }

        .btn-bucin {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-bucin:hover { background: white; color: #050505; }
        
        #nav-container {
            display: none;
            gap: 20px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #nav-container.visible { opacity: 1; }
        
        #btn-open-container {
            display: flex;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .gold-border {
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 2px 8px 8px 2px;
            pointer-events: none;
        }
    </style>
</head>

            // Halaman 3 (Quotes / Kutipan)
            page3Quote: '"Kamu adalah alasan mengapa aku sering tersenyum sendiri tanpa sebab."',
            
            // Halaman 4 (Momen)
            page4Image: "https://images.unsplash.com/photo-1474552226712-ac0f0961a954?auto=format&fit=crop&w=400&q=80",
            page4Title: "Hari-hari Bersamamu",
            page4Text: "Banyak hal magis terjadi sejak kamu hadir. Hal-hal sederhana menjadi luar biasa hanya karena kita melakukannya bersama.",
            
            // Halaman 5 (Ucapan Terima Kasih)

            // Halaman 6 (Penutup)

            page6Title: "Selamanya",
            page6Text: "Mari ciptakan lebih banyak memori, buku ini masih memiliki banyak halaman kosong untuk kita isi.",
            page6Closing: "I Love You ❤️"
        };
        // =========================================================================

        document.addEventListener('DOMContentLoaded', () => {
            // -- INJEKSI KONFIGURASI KE DALAM HTML --
            document.getElementById('audio-bgm').src = CONFIG.audioLink;
            
            document.getElementById('el-cover-title').innerText = CONFIG.coverTitle;
            document.getElementById('el-cover-subtitle').innerText = CONFIG.coverSubtitle;
            
            document.getElementById('el-page1-title').innerText = CONFIG.page1Title;
            document.getElementById('el-page1-text').innerText = CONFIG.page1Text;
            
            document.getElementById('el-page2-img').src = CONFIG.page2Image;
            document.getElementById('el-page2-title').innerText = CONFIG.page2Title;
            document.getElementById('el-page2-text').innerText = CONFIG.page2Text;
            
            document.getElementById('el-page3-quote').innerText = CONFIG.page3Quote;
            
            document.getElementById('el-page4-img').src = CONFIG.page4Image;
            document.getElementById('el-page4-title').innerText = CONFIG.page4Title;
            document.getElementById('el-page4-text').innerText = CONFIG.page4Text;
            
            document.getElementById('el-page5-text').innerText = CONFIG.page5Text;
            
            document.getElementById('el-page6-img').src = CONFIG.page6Image;
            document.getElementById('el-page6-title').innerText = CONFIG.page6Title;
            document.getElementById('el-page6-text').innerText = CONFIG.page6Text;
            document.getElementById('el-page6-closing').innerText = CONFIG.page6Closing;

            // -- MEMBUAT BINTANG DI LATAR BELAKANG --
            const starsContainer = document.getElementById('stars-container');
            const totalStars = 100;
            for (let i = 0; i < totalStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                const size = Math.random() * 3 + 1; // Ukuran bintang 1px - 4px
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                star.style.animationDelay = `${Math.random() * 5}s`;
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                starsContainer.appendChild(star);
            }

            // -- VARIABEL LOGIKA BUKU --
            const book = document.getElementById('book');
            const bookScaler = document.getElementById('book-scaler');
            const coverFrontContent = document.getElementById('cover-front-content');
            const heartSvgContainer = document.getElementById('heart-svg-container');
            
            const controlsWrapper = document.getElementById('controls-wrapper');
            const btnOpenContainer = document.getElementById('btn-open-container');
            const btnOpen = document.getElementById('btn-open');
            const navContainer = document.getElementById('nav-container');
            const btnNext = document.getElementById('btn-next');
            const btnPrev = document.getElementById('btn-prev');
            const audioBgm = document.getElementById('audio-bgm');
            
            const leaves = document.querySelectorAll('.leaf');
            const totalLeaves = leaves.length;
            let currentLeafIndex = 0;

            function updateZIndex() {
                leaves.forEach((leaf, index) => {
                    if (leaf.classList.contains('flipped')) {
                        leaf.style.zIndex = index + 1;
                    } else {
                        leaf.style.zIndex = totalLeaves - index;
                    }
                });
            }
            updateZIndex();

            // -- SIKUENS ANIMASI INTRO --
            // Tunggu air penuh (sekitar 7.5 detik), lalu perkecil ukuran love
            setTimeout(() => {
                heartSvgContainer.classList.add('shrink');
            }, 7800);

            // Setelah love mengecil, tampilkan sampul buku & tombol
            setTimeout(() => {
                coverFrontContent.classList.add('show-cover');
                btnOpenContainer.style.opacity = '1';
                setTimeout(() => document.body.classList.remove('book-closed'), 500);
            }, 9000); // Tampil di detik ke 9


            // -- RESPONSIVE SCALE BUKU --
            function setBookScale() {
                const isMobile = window.innerWidth < 768;
                const padding = isMobile ? 30 : 80;
                let scale = 1;
                
                if (book.classList.contains('is-open')) {
                    const availableWidth = window.innerWidth - padding;
                    if (availableWidth < 600) scale = availableWidth / 600;
                } else {
                    const availableWidth = window.innerWidth - padding;
                    if (availableWidth < 300) scale = availableWidth / 300;
                }
                
                // Pastikan batas skala untuk mobile yang sangat kecil agar UI tombol tetap terlihat nyaman
                if(scale < 0.6 && window.innerHeight < 700) scale = 0.65;

                bookScaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }

            window.addEventListener('resize', setBookScale);
            setBookScale();


            // -- INTERAKSI TOMBOL BUKA BUKU --
            btnOpen.addEventListener('click', () => {
                // Mainkan Audio (Otomatis Diulang)
                audioBgm.play().catch(e => console.log("Audio play di-block browser sebelum ada interaksi: ", e));

                // Sembunyikan tombol buka
                btnOpenContainer.style.display = 'none';
                navContainer.style.display = 'flex'; // Siapkan wadah prev/next
                
                // Geser & Buka Buku
                book.classList.add('is-open');
                controlsWrapper.classList.add('is-open'); // Menggeser letak container tombol
                setBookScale();

                // Balik halaman pertama (sampul)
                leaves[0].classList.add('flipped');
                currentLeafIndex = 1;
                updateZIndex();
                
                // Tampilkan Navigasi
                setTimeout(() => {
                    navContainer.classList.add('visible');
                    updateNavButtons();
                }, 800);
            });

            // -- NAVIGASI HALAMAN --
            function updateNavButtons() {
                if(currentLeafIndex === totalLeaves) {
                    btnNext.style.opacity = '0.3';
                    btnNext.style.pointerEvents = 'none';
                } else {
                    btnNext.style.opacity = '1';
                    btnNext.style.pointerEvents = 'auto';
                }

                // Jika kembali ditutup (sampul depan)
                if(currentLeafIndex === 0) {
                    navContainer.classList.remove('visible');
                    book.classList.remove('is-open');
                    controlsWrapper.classList.remove('is-open');
                    setBookScale();
                    
                    setTimeout(() => {
                        navContainer.style.display = 'none';
                        btnOpenContainer.style.display = 'flex';
                        // Refresh display agar opacity transisi terpanggil
                        setTimeout(() => btnOpenContainer.style.opacity = '1', 50);
                    }, 500);
                }
            }

            btnNext.addEventListener('click', () => {
                if (currentLeafIndex < totalLeaves) {
                    leaves[currentLeafIndex].classList.add('flipped');
                    currentLeafIndex++;
                    updateZIndex();
                    updateNavButtons();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentLeafIndex > 0) {
                    currentLeafIndex--;
                    leaves[currentLeafIndex].classList.remove('flipped');
                    updateZIndex();
                    updateNavButtons();
                }
            });
            
        });
    </script>
</body>
</html>
