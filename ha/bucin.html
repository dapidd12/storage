    <style>
        :root {
            --cover-color: #58111A; 
            --paper-color: #fdfbf7;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #090a0f 0%, #151924 50%, #1f2739 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- ANIMASI BINTANG & KUNANG-KUNANG --- */
        #stars-container, #fireflies-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }
        
        .firefly {
            position: absolute;
            background-color: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffeb3b;
            animation: floatUp infinite ease-in-out;
            opacity: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.5); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            20% { opacity: 0.8; }
            50% { transform: translateY(50vh) translateX(20px) scale(1); opacity: 1; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(-20px) scale(0); opacity: 0; }
        }

        .font-cursive { font-family: 'Dancing Script', cursive; }

        /* --- 3D SCENE & BUKU SETUP --- */
        .scene {
            width: 100vw;
            height: 100vh;
            perspective: 2000px;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        #book-scaler {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            width: 300px;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .book-wrapper {
            position: relative;
            width: 300px;
            height: 420px;
            transform-style: preserve-3d;
        }

        .book {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .book.is-open { transform: translateX(50%); }

        /* --- LEAVES & PAGES --- */
        .leaf {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .leaf.flipped { transform: rotateY(-180deg); }

        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
        }

        .page.back { transform: rotateY(180deg); }

        .page-content {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--paper-color);
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        .page.front .page-content { border-radius: 2px 10px 10px 2px; }
        .page.back .page-content { border-radius: 10px 2px 2px 10px; }

        .shadow-right { box-shadow: inset 20px 0 30px -10px rgba(0,0,0,0.15), inset -2px 0 5px rgba(0,0,0,0.05); }
        .shadow-left { box-shadow: inset -20px 0 30px -10px rgba(0,0,0,0.15), inset 2px 0 5px rgba(0,0,0,0.05); }

        /* --- ANIMASI COVER & LOVE AIR HUJAN --- */
        #cover-front-content {
            background-color: transparent;
            box-shadow: none;
            transition: background-color 1.5s ease, box-shadow 1.5s ease;
        }

        #cover-front-content.show-cover {
            background-color: var(--cover-color);
            box-shadow: inset 4px 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cover-element {
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        #cover-front-content.show-cover .cover-element { opacity: 1; }

        .book-closed .leaf:not(#leaf-0) { opacity: 0; pointer-events: none; }
        .book-closed .page.back { opacity: 0; pointer-events: none; }

        #heart-svg-container {
            transform: scale(3.5);
            transition: transform 2s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 0 15px rgba(255,77,77,0.2));
        }

        #heart-svg-container.shrink {
            transform: scale(1);
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .raindrops { animation: hideRains 0.5s 7.5s forwards; }
        .drop { animation: rainFall linear infinite; }
        .d1 { animation-duration: 0.8s; animation-delay: 0s; }
        .d2 { animation-duration: 1.2s; animation-delay: 0.3s; }
        .d3 { animation-duration: 1s; animation-delay: 0.5s; }
        .d4 { animation-duration: 0.9s; animation-delay: 0.1s; }
        .d5 { animation-duration: 1.1s; animation-delay: 0.4s; }

        @keyframes rainFall {
            0% { transform: translateY(-20px); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(110px); opacity: 0; }
        }
        @keyframes hideRains { to { opacity: 0; display: none; } }

        .water-group {
            transform: translateY(100%);
            animation: fillUp 7.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .water-wave-1 { fill: #ff1a1a; }
        .water-wave-2 { fill: #ff4d4d; animation-delay: 0.3s; }

        @keyframes fillUp {
            0% { transform: translateY(100%); }
            100% { transform: translateY(0%); }
        }

        .polaroid {
            background: white;
            padding: 8px 8px 25px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 2px;
            transform: rotate(-2deg);
            transition: transform 0.3s ease;
        }
        .polaroid:hover { transform: scale(1.05) rotate(0deg); }
        .polaroid.right-tilt { transform: rotate(2deg); }
        .polaroid.right-tilt:hover { transform: scale(1.05) rotate(0deg); }

        /* --- TOMBOL --- */
        #controls-wrapper {
            position: absolute;
            bottom: -70px;
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        #controls-wrapper.is-open { transform: translateX(50%); }

        .btn-bucin {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-bucin:hover { background: white; color: #050505; transform: translateY(-2px); }
        
        #nav-container { display: none; gap: 20px; opacity: 0; transition: opacity 0.5s ease; }
        #nav-container.visible { opacity: 1; }
        
        #btn-open-container { display: flex; opacity: 0; transition: opacity 1s ease; }

        .gold-border {
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 2px 8px 8px 2px;
            pointer-events: none;
        }
    </style>
</head>

            const leaves = document.querySelectorAll('.leaf');
            const totalLeaves = leaves.length;
            let currentLeafIndex = 0;

            function updateZIndex() {
                leaves.forEach((leaf, index) => {
                    if (leaf.classList.contains('flipped')) {
                        leaf.style.zIndex = index + 1;
                    } else {
                        leaf.style.zIndex = totalLeaves - index;
                    }
                });
            }
            updateZIndex();

            setTimeout(() => { heartSvgContainer.classList.add('shrink'); }, 7800);

            setTimeout(() => {
                coverFrontContent.classList.add('show-cover');
                btnOpenContainer.style.opacity = '1';
                setTimeout(() => document.body.classList.remove('book-closed'), 500);
            }, 9000);

            function setBookScale() {
                const isMobile = window.innerWidth < 768;
                const padding = isMobile ? 30 : 80;
                let scale = 1;
                
                if (book.classList.contains('is-open')) {
                    const availableWidth = window.innerWidth - padding;
                    if (availableWidth < 600) scale = availableWidth / 600;
                } else {
                    const availableWidth = window.innerWidth - padding;
                    if (availableWidth < 300) scale = availableWidth / 300;
                }
                
                if(scale < 0.6 && window.innerHeight < 700) scale = 0.65;
                bookScaler.style.transform = `translate(-50%, -50%) scale(${scale})`;
            }

            window.addEventListener('resize', setBookScale);
            setBookScale();

            btnOpen.addEventListener('click', () => {
                audioBgm.play().catch(e => console.log("Audio block: ", e));
                btnOpenContainer.style.display = 'none';
                navContainer.style.display = 'flex'; 
                
                book.classList.add('is-open');
                controlsWrapper.classList.add('is-open');
                setBookScale();

                leaves[0].classList.add('flipped');
                currentLeafIndex = 1;
                updateZIndex();
                
                setTimeout(() => {
                    navContainer.classList.add('visible');
                    updateNavButtons();
                }, 800);
            });

            function updateNavButtons() {
                if(currentLeafIndex === totalLeaves) {
                    btnNext.style.opacity = '0.3';
                    btnNext.style.pointerEvents = 'none';
                } else {
                    btnNext.style.opacity = '1';
                    btnNext.style.pointerEvents = 'auto';
                }

                if(currentLeafIndex === 0) {
                    navContainer.classList.remove('visible');
                    book.classList.remove('is-open');
                    controlsWrapper.classList.remove('is-open');
                    setBookScale();
                    
                    setTimeout(() => {
                        navContainer.style.display = 'none';
                        btnOpenContainer.style.display = 'flex';
                        setTimeout(() => btnOpenContainer.style.opacity = '1', 50);
                    }, 500);
                }
            }

            btnNext.addEventListener('click', () => {
                if (currentLeafIndex < totalLeaves) {
                    leaves[currentLeafIndex].classList.add('flipped');
                    currentLeafIndex++;
                    updateZIndex();
                    updateNavButtons();
                }
            });

            btnPrev.addEventListener('click', () => {
                if (currentLeafIndex > 0) {
                    currentLeafIndex--;
                    leaves[currentLeafIndex].classList.remove('flipped');
                    updateZIndex();
                    updateNavButtons();
                }
            });
            
        });
    </script>
</body>
</html>
